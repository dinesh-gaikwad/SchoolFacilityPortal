<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Facility Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const API = `http://${window.location.hostname}:3000/api`;

    function App() {
      const [token, setToken] = useState(localStorage.getItem('token'));
      const [role, setRole] = useState(localStorage.getItem('role'));
      const [name, setName] = useState(localStorage.getItem('name'));
      const [page, setPage] = useState('login');

      const logout = () => {
        localStorage.clear();
        setToken(null);
        setPage('login');
      };

      return (
        <div className="bg-light min-vh-100 pb-5">
          {token && (
            <nav className="navbar navbar-dark bg-primary">
              <div className="container-fluid">
                <span className="navbar-brand">School Facility Portal</span>
                <div className="d-flex align-items-center">
                  <span className="text-white me-3">{name} ({role})</span>
                  <button className="btn btn-danger btn-sm" onClick={logout}>Logout</button>
                </div>
              </div>
            </nav>
          )}
          <div className="container py-4">
            {!token && <Login setToken={setToken} setRole={setRole} setName={setName} setPage={setPage}/>}
            {token && page==='dashboard' && <Dashboard/>}
            {token && page==='report' && <ReportIssue setPage={setPage}/>}
            {token && page==='track' && <TrackIssues role={role}/>}
            {token && page==='admin' && role==='Admin' && <AdminPanel/>}
          </div>
          {token && (
            <div className="fixed-bottom bg-white border-top p-2">
              <div className="container d-flex justify-content-around">
                <button className="btn btn-link" onClick={()=>setPage('dashboard')}>Dashboard</button>
                <button className="btn btn-link" onClick={()=>setPage('report')}>Report</button>
                <button className="btn btn-link" onClick={()=>setPage('track')}>Track</button>
                {role==='Admin' && <button className="btn btn-link" onClick={()=>setPage('admin')}>Admin</button>}
              </div>
            </div>
          )}
        </div>
      );
    }

    function Login({setToken,setRole,setName,setPage}) {
      const [isLogin, setIsLogin] = useState(true);
      const [form, setForm] = useState({name:'',email:'',password:'',role:'Parent',school_id:'SCH001'});
      const handleSubmit = async () => {
        const endpoint = isLogin ? '/login' : '/register';
        const res = await fetch(API+endpoint, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify(form)
        });
        const data = await res.json();
        if (res.ok) {
          if (isLogin) {
            localStorage.setItem('token', data.token);
            localStorage.setItem('role', data.role);
            localStorage.setItem('name', data.name);
            setToken(data.token); setRole(data.role); setName(data.name);
            setPage('dashboard');
          } else { alert('Registered! Please login'); setIsLogin(true); }
        } else alert(data.error);
      };
      return (
        <div className="card mx-auto mt-5" style={{maxWidth:'400px'}}>
          <div className="card-body">
            <h3 className="card-title text-center mb-4">{isLogin ? 'Login' : 'Register'}</h3>
            {!isLogin && <input className="form-control mb-2" placeholder="Name" onChange={e=>setForm({...form,name:e.target.value})}/>}
            <input className="form-control mb-2" placeholder="Email" onChange={e=>setForm({...form,email:e.target.value})}/>
            <input type="password" className="form-control mb-2" placeholder="Password" onChange={e=>setForm({...form,password:e.target.value})}/>
            {!isLogin && (
              <select className="form-select mb-2" onChange={e=>setForm({...form,role:e.target.value})}>
                <option>Parent</option><option>Teacher</option><option>Admin</option>
              </select>
            )}
            <button className="btn btn-primary w-100" onClick={handleSubmit}>{isLogin ? 'Login' : 'Register'}</button>
            <p className="text-center mt-3">
              {isLogin ? "No account? " : "Have account? "}
              <button className="btn btn-link p-0" onClick={()=>setIsLogin(!isLogin)}>{isLogin ? 'Register' : 'Login'}</button>
            </p>
          </div>
        </div>
      );
    }

    function Dashboard() {
      const [stats, setStats] = useState({total:0,pending:0,resolved:0});
      useEffect(()=>{
        fetch(API+'/issues',{headers:{'Authorization':'Bearer '+localStorage.getItem('token')}})
        .then(r=>r.json()).then(data=>{
          setStats({
            total:data.length,
            pending:data.filter(i=>i.status==='Pending').length,
            resolved:data.filter(i=>i.status==='Resolved').length
          });
        });
      },[]);
      return (
        <>
          <h2 className="mb-4">Dashboard</h2>
          <div className="row">
            <div className="col-md-4"><div className="card text-white bg-primary mb-3"><div className="card-body"><h5>Total Issues</h5><h2>{stats.total}</h2></div></div></div>
            <div className="col-md-4"><div className="card text-white bg-warning mb-3"><div className="card-body"><h5>Pending</h5><h2>{stats.pending}</h2></div></div></div>
            <div className="col-md-4"><div className="card text-white bg-success mb-3"><div className="card-body"><h5>Resolved</h5><h2>{stats.resolved}</h2></div></div></div>
          </div>
        </>
      );
    }

    function ReportIssue({setPage}) {
      const [form, setForm] = useState({description:'',category:'Furniture',location:'',priority:'Medium'});
      const [file, setFile] = useState(null);
      const submit = async () => {
        const fd = new FormData();
        Object.keys(form).forEach(k=>fd.append(k,form[k]));
        if(file) fd.append('image',file);
        const res = await fetch(API+'/report',{
          method:'POST',
          headers:{'Authorization':'Bearer '+localStorage.getItem('token')},
          body:fd
        });
        if(res.ok){alert('Issue reported!'); setPage('track');} else alert('Error');
      };
      return (
        <div className="card">
          <div className="card-body">
            <h3 className="card-title">Report Issue</h3>
            <textarea className="form-control mb-2" placeholder="Describe the problem" onChange={e=>setForm({...form,description:e.target.value})}></textarea>
            <select className="form-select mb-2" onChange={e=>setForm({...form,category:e.target.value})}>
              <option>Furniture</option><option>Toilet</option><option>Electrical</option><option>Sanitation</option><option>Classroom</option>
            </select>
            <input className="form-control mb-2" placeholder="Location e.g. Classroom 5" onChange={e=>setForm({...form,location:e.target.value})}/>
            <select className="form-select mb-2" onChange={e=>setForm({...form,priority:e.target.value})}>
              <option>Low</option><option>Medium</option><option>High</option>
            </select>
            <input type="file" className="form-control mb-3" onChange={e=>setFile(e.target.files[0])}/>
            <button className="btn btn-primary w-100" onClick={submit}>Submit Issue</button>
          </div>
        </div>
      );
    }

    function TrackIssues({role}) {
      const [issues, setIssues] = useState([]);
      useEffect(()=>{load();},[]);
      const load = () => {
        fetch(API+'/issues',{headers:{'Authorization':'Bearer '+localStorage.getItem('token')}})
        .then(r=>r.json()).then(setIssues);
      };
      const updateStatus = (id,status) => {
        fetch(API+`/issues/${id}/status`,{
          method:'PUT',
          headers:{'Content-Type':'application/json','Authorization':'Bearer '+localStorage.getItem('token')},
          body:JSON.stringify({status})
        }).then(()=>load());
      };
      return (
        <>
          <h3 className="mb-4">Track Issues</h3>
          {issues.map(i=>(
            <div key={i.id} className="card mb-3">
              <div className="card-body">
                <h5 className="card-title">{i.category} - {i.location}</h5>
                <p className="card-text">{i.description}</p>
                <p><strong>Priority:</strong> {i.priority} | <strong>Status:</strong> <span className={i.status==='Resolved'?'text-success':'text-warning'}>{i.status}</span></p>
                {i.image_path && <img src={`${API.replace('/api','')}/uploads/${i.image_path}`} className="img-thumbnail" style={{width:'150px'}}/>}
                {role==='Admin' && i.status!=='Resolved' && (
                  <button className="btn btn-success btn-sm mt-2" onClick={()=>updateStatus(i.id,'Resolved')}>Mark Resolved</button>
                )}
              </div>
            </div>
          ))}
        </>
      );
    }

    function AdminPanel() { return <TrackIssues role="Admin"/>; }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
